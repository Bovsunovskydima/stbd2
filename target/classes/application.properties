spring.application.name=cafenet

server.port=${APP_PORT:8090}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/cafenet}
spring.datasource.username=${DB_USER:cafenet}
spring.datasource.password=${DB_PASSWORD:cafenet}
spring.datasource.hikari.pool-name=cafenet-pool
spring.datasource.hikari.maximum-pool-size=8

spring.liquibase.change-log=classpath:db/changelog/master.yaml

spring.mongodb.uri=${MONGO_URI:mongodb://localhost:27018/cafenet_reviews}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6380}
spring.data.redis.timeout=2s

spring.jackson.serialization.indent-output=true
spring.jackson.default-property-inclusion=non_null

spring.mvc.format.date-time=iso

cafenet.reviews.collection=reviews
cafenet.redis.prefix=cafenet
cafenet.redis.cache-ttl-seconds=900
cafenet.redis.cooldown-seconds=60

cafenet.benchmark.reviews=5000
cafenet.benchmark.iterations=150
cafenet.benchmark.warmup=40
